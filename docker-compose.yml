services:
  web:
    build: .
    ports: ["3000:3000"]
  api:
    build: ./backend
    ports: ["5000:5000"]
    environment:
      PORT: 5000
      DATABASE_URL: postgres://travelmind:travelmind@postgres:5432/travelmind
      JWT_SECRET: local-demo-secret-change-me
      DEMO_MODE: "true"
      FRONTEND_URL: http://localhost:3000
    depends_on: [postgres]
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: travelmind
      POSTGRES_USER: travelmind
      POSTGRES_PASSWORD: travelmind
    volumes: [travelmind-data:/var/lib/postgresql/data]
volumes:
  travelmind-data:
